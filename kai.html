<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>会じたく — 酒縁結び（主催者用）</title>
<style>
  :root {
    --paper: #faf6ee; --ink: #2b2b33; --sub: #6d6a60;
    --accent: #a63d40; --line: #d9d2c2; --card: #fffdf7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", serif;
    line-height: 1.8;
  }
  main { max-width: 640px; margin: 0 auto; padding: 40px 16px 80px; }
  h1 { font-size: 1.5rem; letter-spacing: 0.3em; text-indent: 0.3em; text-align: center; margin: 0 0 4px; }
  .sub { color: var(--sub); font-size: 0.85rem; text-align: center; margin: 0 0 28px; }
  textarea {
    width: 100%; min-height: 180px; padding: 14px; font: inherit; font-size: 1rem;
    background: var(--card); border: 1px solid var(--line); border-radius: 6px; color: var(--ink);
  }
  button {
    display: block; width: 100%; margin: 14px 0 0; padding: 14px; font: inherit; font-size: 1.05rem;
    letter-spacing: 0.3em; text-indent: 0.3em; cursor: pointer;
    background: var(--accent); color: #fff; border: none; border-radius: 6px;
  }
  button.ghost { background: var(--card); color: var(--ink); border: 1px solid var(--line); letter-spacing: 0.1em; text-indent: 0.1em; }
  .tmpl { margin: 0 0 10px; font-size: 0.85rem; }
  .tmpl a { color: var(--accent); }
  .tmpl small { color: var(--sub); font-size: 0.78rem; margin-left: 10px; }
  #report { margin-top: 24px; font-size: 0.92rem; }
  #report .ok::before { content: "◎ "; color: var(--accent); }
  #report .ng::before { content: "✗ "; }
  #report .ng { color: var(--accent); }
  #report .note { color: var(--sub); font-size: 0.85rem; }
  #report button.pick { display: inline-block; width: auto; margin: 2px 0 2px 8px; padding: 2px 12px;
    font: inherit; font-size: 0.82rem; letter-spacing: 0.04em; text-indent: 0; vertical-align: 1px;
    background: var(--card); color: var(--accent); border: 1px solid var(--accent); border-radius: 14px; }
  #out { margin-top: 20px; background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 18px; }
  /* URLは長くなる（会の本数だけ伸びる）。全文は出さず1行に省略＝コピーとQRで使ってもらう */
  #kai-url { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
             font-size: 0.8rem; color: var(--accent); }
  #qr { margin: 18px auto 0; width: 232px; background: #fff; padding: 12px; border: 1px solid var(--line); }
  footer { margin-top: 40px; text-align: center; color: var(--sub); font-size: 0.8rem; }
  footer a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>会じたく</h1>
  <p class="sub">日本酒会のリストを貼ると、その日の酒だけで縁を結ぶURLとQRができます（主催者用）</p>

  <p class="tmpl"><a href="#" id="dl-template">記入用のファイルをダウンロード →</a><small>表計算ソフトで開いて書き、範囲をコピーして下に貼ります</small></p>
  <textarea id="list" placeholder="1行に1本。スペックが混ざっていても大丈夫です。&#10;例：&#10;剣菱 純米酒&#10;満寿泉 大吟醸&#10;奥丹波&#10;&#10;表計算ソフトから範囲をコピーして貼ると、いちばん右の列を味わいコメントとして拾います（紙の一覧にだけ出ます）。"></textarea>
  <button id="make">URL を つくる</button>

  <div id="report"></div>
  <div id="out" hidden>
    <p style="margin:0 0 6px;"><a id="kai-url" target="_blank" rel="noopener"></a></p>
    <button class="ghost" id="copy">URLをコピー</button>
    <p style="margin:10px 0 0;font-size:0.82rem;"><a id="map-url" target="_blank" rel="noopener" style="color:var(--accent);">この会の蔵だけの地図 →</a>
      <span style="color:var(--sub);font-size:0.78rem;">（会場のスクリーンに）</span></p>
    <p style="margin:4px 0 0;font-size:0.82rem;"><a id="list-url" target="_blank" rel="noopener" style="color:var(--accent);">今日の日本酒リスト →</a>
      <span style="color:var(--sub);font-size:0.78rem;">（印刷できます）</span></p>
    <div id="qr"></div>
    <p class="note" style="text-align:center;color:var(--sub);font-size:0.8rem;margin:10px 0 0;">
      QRを読むと、上の酒だけから縁を引く画面が開きます。</p>
  </div>

  <footer><a href="index.html">← 酒縁結び（全国版）</a></footer>
</main>

<script src="kai_parse.js"></script>
<script src="kura_data.js?v=1793854600"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
// tools/make_kai.py を廃止してここに一本化（2026-09-07）。照合規則は同一：
//  1) スペック語は照合の前に行から除き、それ単体の「銘柄」も索引に入れない
//     （「剣菱 純米酒」がカタログに『純米酒』を持つ別蔵へ最長一致で吸われた実例）
//  2) 同名銘柄が複数蔵なら「銘柄以外の残り文字」の蔵名・県名だけで絞る
//     （「男山」が蔵名＝銘柄名の蔵に誤確定した実例）。絞れなければ推測せず保留して人に返す
const BASE = 'https://y-kanno-sakenote.github.io/sake-enmusubi/';
const SPEC = /純米大吟醸|純米吟醸|特別純米|特別本醸造|大吟醸|吟醸|本醸造|純米酒|純米|生原酒|原酒|生酒|にごり|無濾過|火入れ|ひやおろし|新酒|古酒|山廃|生酛|きもと|辛口|甘口|スパークリング/g;
const nrm = x => x.normalize('NFKC').replace(/[\s　]/g, '');
const core = n => n.replace(/株式会社|有限会社|合資会社|合名会社|合同会社|[㈱㈲㈴㈾]|[（(](株|有|資|名|同)[)）]|\s/g, '');
const mainB = b => b.replace(/[（(].*?[)）]/g, '').split(/[・／,、]/)[0].trim() || b;

const seg2k = new Map();   // 正規化した銘柄 → [{s:原表記, k:蔵}]
for (const k of KURA) {
  const raw = k.b + (k.b2 ? '・' + k.b2 : '');
  for (let s of raw.replace(/[（(][^）)]*[）)]/g, '').split(/[・／,、]/)) {
    s = s.trim();
    if (s.length >= 2 && nrm(s).replace(SPEC, '') !== '') {
      const key = nrm(s);
      if (!seg2k.has(key)) seg2k.set(key, []);
      seg2k.get(key).push({ s, k });
    }
  }
}

const uniqK = a => new Set(a.map(c => c.k.p + '|' + c.k.n)).size;

function matchLine(line) {
  // 法人格も落としてから照合する。「太田酒造（株）灘工場」が、(株)を挟むせいで灘工場の蔵名に一致せず
  // 滋賀の「太田酒造」に錨が落ちた実例（2026-09-08）
  const L = core(nrm(line).replace(SPEC, ''));

  // 0) 行に蔵名が書かれていれば、それを錨にする（銘柄の部分一致より先）。
  //    「太田酒造」の中の「田酒」が青森・西田酒造店に当たった実例（2026-09-08）。
  //    ただし蔵名がそのまま他蔵の銘柄でもある場合（男山＝男山(株)）は錨にしない＝従来の保留に落とす
  let anc = [];
  for (const k of KURA) {
    const c = nrm(core(k.n));
    if (!c || !L.includes(c)) continue;
    const owners = seg2k.get(c);
    if (owners && owners.some(o => o.k !== k)) continue;
    anc.push({ k, c });
  }
  if (anc.length) {
    const maxLen = Math.max(...anc.map(x => x.c.length));
    anc = anc.filter(x => x.c.length === maxLen);          // 「太田酒造灘工場」は「太田酒造」より長い方を採る
    if (uniqK(anc) > 1) {
      const f = anc.filter(x => L.split(x.c).join('').includes(x.k.p));   // 同名別蔵は県名で
      if (f.length) anc = f;
      // 県名で決まらなければ、**行に書かれた銘柄**で絞る。法人格の組文字（㈾）まで畳むようにしたら、
      // 伊藤酒造（株）＝三重・鈿女 と 伊藤酒造㈾＝福井・越の鷹 が同じ名前になり、(株)側が自分の
      // 銘柄を書いても「複数の県」と言われるようになった（qa係が3組を検出・2026-11-05）
      // 法人格まで書いてあれば、それで決める（「伊藤酒造（株）」＝三重・「伊藤酒造㈾」＝福井）。
      // NFKC で ㈾→(資)・（株）→(株) に揃うので、書き方の揺れは吸収される
      // **正式名に法人格が含まれる蔵だけ**この段で決める。法人格の無い短い正式名（兵庫「田中酒造場」）は、
      // 法人格つきの別の蔵（岡山「（有）田中酒造場」）の行の中にも部分一致して、黙って誤結合した（qa係）
      if (uniqK(anc) > 1) {
        const raw = nrm(line);
        const h = anc.filter(x => nrm(x.k.n) !== core(nrm(x.k.n)) && raw.includes(nrm(x.k.n)));
        if (h.length && uniqK(h) === 1) anc = h;
      }
      if (uniqK(anc) > 1) {
        const rest = L.split(anc[0].c).join('');
        const g = anc.filter(x => [...seg2k].some(([key, es]) => rest.includes(key) && es.some(e => e.k === x.k)));
        if (g.length && uniqK(g) === 1) anc = g;
      }
      if (uniqK(anc) > 1)
        return { err: `蔵名「${anc[0].k.n}」が複数の県にあります`, cands: anc.map(x => x.k) };
    }
    let { k, c } = anc[0];
    const c0 = c;                               // 最初に錨にした文字列（顔から外すために覚えておく）
    let rest = L.split(c).join('');
    // 「兵庫 太田酒造」のように、錨の蔵名を含む長い蔵名（太田酒造灘工場）が別県にあり、行にその県名があればそちら
    const alt = KURA.find(k2 => k2 !== k && k2.p !== k.p && nrm(core(k2.n)).includes(c) && rest.includes(k2.p));
    if (alt) { k = alt; c = nrm(core(alt.n)); }
    rest = rest.split(k.p).join('');
    // その蔵自身の銘柄が残りに含まれれば、それが顔
    let own = null;
    for (const [key, es] of seg2k) {
      const e = es.find(x => x.k === k);
      if (e && rest.includes(key) && (!own || key.length > own.key.length)) own = { key, s: e.s };
    }
    if (own) return { k, b: own.s, anc: [c0, c] };
    const face = rest.replace(/[（）()「」『』\[\]・／／,、。:：\/\-–—]/g, '');
    return face ? { k, b: face, own: true, anc: [c0, c] } : { k, b: '', anc: [c0, c] };
  }

  let best = null;
  for (const key of seg2k.keys())
    if (L.includes(key) && (!best || key.length > best.length)) best = key;
  if (!best) return { err: '銘柄も蔵名も見つかりません（蔵名は正式名で書いてください）' };
  let cands = seg2k.get(best);
  const uniq = uniqK;
  if (uniq(cands) > 1) {
    const rest = L.split(best).join('');
    const f = cands.filter(c => (nrm(core(c.k.n)) && rest.includes(nrm(core(c.k.n)))) || rest.includes(c.k.p));
    if (f.length) cands = f;
    if (uniq(cands) > 1)
      return { err: `銘柄「${cands[0].s}」の蔵が複数あります`, cands: [...new Set(cands.map(c => c.k))] };
  }
  return { k: cands[0].k, b: cands[0].s };
}

// 札の顔はリストに書いたとおりにする（「剣菱 純米酒」なら札も「剣菱 純米酒」）。蔵名と県名だけ顔から外す。
// 空になったら（「兵庫 太田酒造」のように蔵名だけの行）蔵のカタログの銘柄に落ちる
function faceOf(line, k, fallback, anc) {
  let f = line.normalize('NFKC');
  // 蔵名は「太田酒造 灘工場」のように途中に空白があっても外す（文字の間に空白を許す正規表現で消す）
  const esc = t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  // 蔵名を外したあと「酒造」だけが取り残されることがある。登録名が「(株)加越」なのに
  // 行に「加越酒造」と書かれた場合で、顔が「酒造 加賀ノ月…」になっていた（2026-09-16）。
  // ①蔵名＋接尾辞（直後にあり独立した語のときだけ）→ ②蔵名そのもの、の順で消す。
  // 1本にまとめて接尾辞を省略可にすると、「日本盛株式会社 惣花」のように蔵名の直後が
  // 非空白の行で後読みが外れ、蔵名ごと顔に残る（1,197蔵規模の回帰・qa係が検出）。
  // 接尾辞は実害の出た酒造系だけ——登録名の末尾は酒造795/酒造店105/酒造場86に対し
  // 本店40・商店24で、しかも本店・商店は銘柄側の注記にも現れうる（入れても現データでは得が無い）
  const TAIL = '\\s*(?:酒造場|酒造店|酒造|醸造元)(?=\\s|$)';
  for (const nm of [k.n.normalize('NFKC'), core(k.n).normalize('NFKC'), ...(anc || [])]) {
    if (!nm) continue;
    const base = [...nm].map(esc).join('\\s*');
    f = f.replace(new RegExp(base + TAIL, 'g'), ' ');
    f = f.replace(new RegExp(base, 'g'), ' ');
  }
  if (k.p) f = f.replace(new RegExp([...k.p].map(esc).join('\\s*'), 'g'), ' ');
  f = f.replace(/株式会社|有限会社|合資会社|合名会社|合同会社|[㈱㈲㈴㈾]|\((株|有|資|名|同)\)/g, ' ');   // 法人格の書き残しも顔に出さない
  f = f.replace(/[（）()「」『』\[\]／,、。:：\/\-–—]/g, ' ').replace(/\s+/g, ' ').trim().replace(/^の|の$/g, '').trim();
  return f || fallback;
}

// 記入用のファイル。見出しも例も「#」で始める——会じたくは # の行を読み飛ばすので、
// 消し忘れてもその行が会に混ざらない。Excel で文字化けしないよう BOM 付きで出す
document.getElementById('dl-template').addEventListener('click', e => {
  e.preventDefault();
  // 見出しに例を入れて1行で済ませる。「#」で始まるので、消さずに貼っても読み飛ばされる
  const csv = '\ufeff' + [
    '#蔵名（○○酒造）,商品名（純米酒 △△正宗）,味わい（スッキリ ※なくてもよい）',
    '', '', '', '', '', '', '', '', '', '', '', '', '', '', ''
  ].join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = '日本酒リスト.csv';
  document.body.appendChild(a);   // Safari は DOM に無い <a> の click() を無視する版がある
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});

let qrObj = null;
const MAKE_NEW = 'URL を つくる', MAKE_AGAIN = 'URL を つくり直す';

// 確認欄で選び直した蔵を覚えておく表。**行の文字列をキーにする**——行番号だと
// 1本足した瞬間に全部ずれる。貼り直して文字列が変われば自然に外れる
const PICKED = new Map();

// 貼られた文字を読み、1行ずつ蔵に当てる。画面を触らないので何度でも呼べる
function analyze() {
  // スプレッドシートから範囲コピーするとタブ区切りで入る。**最後の列を味わいコメント**として拾い、
  // 残りを酒の行として扱う。1列だけの貼り付け（従来）はそのまま動く。
  // 味わいは紙の一覧にだけ出すもので、縁の判定には一切使わない（2026-09-18）
  const rows = document.getElementById('list').value.split('\n')
    .map(x => x.replace(/\s+$/, '')).filter(x => x.trim() && !x.trim().startsWith('#'))
    .map(x => {
      const cols = x.split('\t').map(c => c.trim()).filter(Boolean);
      return cols.length >= 2 ? { line: cols.slice(0, -1).join(' '), taste: cols[cols.length - 1] }
                              : { line: x.trim(), taste: '' };
    });
  const ok = [], ng = [];
  for (const { line, taste } of rows) {
    const picked = PICKED.get(line);
    // 選び直した蔵には錨（anc）が無いので、faceOf は蔵名・県名だけを顔から外す。
    // 外し切れずに蔵名が顔に残ることがあるため、確認欄では必ず「札の顔」を見せる
    const m = picked ? { k: picked, b: mainB(picked.b), anc: [] } : matchLine(line);
    if (m.err) { ng.push({ line, err: m.err, cands: m.cands }); continue; }
    // 蔵名を顔から外した結果、銘柄まで消えることがある（「一ノ蔵 特別純米」＝蔵名と銘柄が同じ語）。
    // 顔にその蔵の銘柄が1つも残っていなければ代表銘柄を頭に戻す。委託醸造・PB（own）は戻さない
    let face = faceOf(line, m.k, m.b, m.anc);
    const segs = (m.k.b + (m.k.b2 ? '・' + m.k.b2 : '')).replace(/[（(].*?[)）]/g, '')
      .split(/[・／,、]/).map(x => x.trim()).filter(x => x.length >= 2);
    if (face && !segs.some(sg => face.includes(sg))) {
      // **選び直した蔵には代表銘柄を貼らない**。選び直す行は、その蔵のカタログに無い銘柄が
      // 書かれているのが普通で、頭に代表銘柄を足すと「豊能梅 十四代」のような
      // 実在しない酒名ができる（qa係が116組を検出）。警告を付けて入力のまま出す
      if (picked) m.own = true;
      else if (!m.own) face = mainB(m.k.b) + ' ' + face;
    }
    ok.push({ line, ...m, b: face, taste });
  }
  return { ok, ng };
}

// 確認欄を描く。✗の行では「県名を足してください」と書く代わりに、**候補の蔵そのものを押せる形**で出す
function render(ok, ng) {
  const rep = document.getElementById('report');
  rep.innerHTML = '';
  const add = (cls, text) => { const d = document.createElement('div'); d.className = cls; d.textContent = text; rep.appendChild(d); };
  for (const o of ok) add('ok', `${o.line} → ${o.k.p}・${o.k.n}` +
    (o.b ? `（札の顔: ${o.b}${o.own ? ' ※蔵のカタログに無い銘柄' : ''}）` : '（銘柄が書かれていないため代表銘柄で表示）') +
    (o.taste ? `　味わい: ${o.taste}` : ''));
  for (const n of ng) {
    const d = document.createElement('div');
    d.className = 'ng';
    d.appendChild(document.createTextNode(`${n.line} → ${n.err}`));
    if (n.cands && n.cands.length) {
      // 蔵名が同じなら県名だけ、違う蔵なら「県・蔵名」。**エラー文を割って候補を作らない**
      const sameName = n.cands.every(k => core(k.n) === core(n.cands[0].n));
      for (const k of n.cands) {
        const b = document.createElement('button');
        b.className = 'pick';
        b.textContent = sameName ? k.p : `${k.p}・${k.n}`;
        b.addEventListener('click', () => { PICKED.set(n.line, k); refresh(); });
        d.appendChild(b);
      }
    }
    rep.appendChild(d);
  }
  if (ng.length) add('note', '✗の行はURLに入っていません。候補を押すか、行を直してください。');
  const dupKura = ok.length - new Set(ok.map(o => o.k.p + '|' + o.k.n)).size;
  if (dupKura > 0) add('note', `同じ蔵の銘柄が複数あります。札は蔵ごとに1枚で、顔は下の行の銘柄になります。`);
}

// 選び直したら**URLとQRを消す**。黙って作り直すと、配った紙と新しいQRのどちらが正か分からなくなる。
// 消えていれば主催者は必ず「URL を つくる」を押し直し、全部の行をもう一度見る
function refresh() {
  const { ok, ng } = analyze();
  render(ok, ng);
  document.getElementById('out').hidden = true;
  // 迷い行を押し切ると案内が全部消えて、押し直す先が画面から無くなる。
  // 新しい文言は足さず、ボタンの文字で示す（qa係の指摘）
  document.getElementById('make').textContent = MAKE_AGAIN;
}

document.getElementById('make').addEventListener('click', () => {
  const { ok, ng } = analyze();
  render(ok, ng);
  const out = document.getElementById('out');
  if (!ok.length) { out.hidden = true; return; }
  // URLは短ID形式（?k=）。顔はカタログ番号＋スペック辞書で圧縮する（kai_parse.js の kaiFaceEncode）。
  // 圧縮できない銘柄（委託醸造・PBなど）は生文字列のまま。表示は入力どおりのまま変わらない
  // **1件ずつ符号化してから生のカンマで繋ぐ**。まとめて符号化して %2C を , に戻すと、
  // 銘柄に書かれた半角カンマまで区切りになって蔵が1つずつずれる（t= と同じ穴・2026-09-18）
  const kai = ok.map(o => {
    const c = kaiFaceEncode(o.k, o.b === mainB(o.k.b) ? '' : o.b);
    return encodeURIComponent(c ? `${o.k.id}.${c}` : o.k.id);
  }).join(',');
  const url = BASE + '?k=' + kai;
  // 味わいは紙の一覧にしか要らない。**札のURL（＝QRの中身）には入れない**——
  // 入れるとQRのモジュールが増えて40mmでは読めなくなる（2026-09-18 実測）
  const tz = ok.map(o => kaiTasteEncode(o.taste));
  // **1件ずつ符号化してから生のカンマで繋ぐ**。まとめて符号化して %2C を , に戻すと、
  // 味わいに書かれた半角カンマまで区切りになって1本ずつずれる（qa係が検出）
  const tq = tz.some(Boolean) ? '&t=' + tz.map(encodeURIComponent).join(',') : '';
  const a = document.getElementById('kai-url');
  a.href = url; a.textContent = url;
  document.getElementById('map-url').href = url.replace('?k=', 'map.html?k=');
  document.getElementById('list-url').href = url.replace('?k=', 'list.html?k=') + tq;
  document.getElementById('qr').innerHTML = '';
  qrObj = new QRCode(document.getElementById('qr'), { text: url, width: 208, height: 208, correctLevel: QRCode.CorrectLevel.M });
  out.hidden = false;
  document.getElementById('make').textContent = MAKE_NEW;
});

document.getElementById('copy').addEventListener('click', () => {
  const url = document.getElementById('kai-url').href;
  const b = document.getElementById('copy');
  const done = okd => { b.textContent = okd ? 'コピーしました' : 'コピーできませんでした'; setTimeout(() => { b.textContent = 'URLをコピー'; }, 2000); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(() => done(true)).catch(() => done(false));
  else done(false);
});
</script>
</body>
